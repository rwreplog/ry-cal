server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker script and the HTML shell must always be revalidated —
    # caching them (as the regex block below otherwise would for sw.js, since it
    # matches \.js$ too) defeats the PWA's own update check and can leave a browser
    # running a build from days ago after a fresh deploy, invisibly out of sync with
    # what's actually on the server.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes these filenames on every build, so a long cache is safe —
    # a stale cached file is simply never referenced by the new index.html/sw.js.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 7d;
        access_log off;
    }
}
