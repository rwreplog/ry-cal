services:
  postgres:
    image: postgres:17
    container_name: replogle-hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-replogle_hq}
      POSTGRES_USER: ${POSTGRES_USER:-replogle_hq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - replogle-hq-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: replogle-hq-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-replogle_hq};Username=${POSTGRES_USER:-replogle_hq};Password=${POSTGRES_PASSWORD:-change-me}
      Cors__AllowedOrigins__0: http://localhost:5173
      Frontend__BaseUrl: http://localhost:5173
      Auth__Secret: ${AUTH_SECRET:-change-me}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Weather__ApiKey: ${WEATHER_API_KEY:-}
      DataProtection__KeyRingPath: /keys
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - replogle-hq-dataprotection-keys:/keys

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: replogle-hq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  replogle-hq-postgres:
  replogle-hq-dataprotection-keys:
